name: ShellCheck

on:
  push:
    paths: ["scripts/**", ".github/workflows/shellcheck.yml"]
  pull_request:
    paths: ["scripts/**", ".github/workflows/shellcheck.yml"]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
          done

      # GitHub's ubuntu-latest image ships with shellcheck
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck -x scripts/*.sh
